<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pavimentos | Obra Control</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/sidebar.css">

    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="stylesheet" href="../css/components/tables.css">
    <link rel="stylesheet" href="../css/components/badges.css">
    <link rel="stylesheet" href="../css/components/breadcrumb.css">
    <link rel="stylesheet" href="../css/components/progress.css">

    <link rel="stylesheet" href="../css/pages/dashboard.css">
    <link rel="stylesheet" href="../css/pages/pavimentos.css">
</head>

<body>

    <div class="app-container">

        <aside class="sidebar" id="sidebar">
        </aside>

        <main class="main-content">
            <header id="header-container"></header>

            <section class="dashboard">
                <div id="breadcrumb"></div>

                <div class="dashboard-header">
                    <h2>Cadastro de Pavimentos</h2>
                    <p>Cadastre os pavimentos de cada obra.</p>
                </div>

                <div class="form-card">
                    <form id="pavimento-form">
                        <div class="form-group">
                            <label for="obra">Obra</label>

                            <select id="obra" required>
                                <option value="">Selecione uma obra</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="nome">Nome do Pavimento</label>

                            <input type="text" id="nome" placeholder="Ex: Térreo" required>
                        </div>

                        <div class="form-group">
                            <label for="descricao">Descrição</label>

                            <input type="text" id="descricao" placeholder="Descrição do pavimento">
                        </div>

                        <div class="form-group">
                            <label for="status">Status</label>

                            <select id="status">
                                <option>Planejamento</option>
                                <option>Em andamento</option>
                                <option>Concluído</option>
                            </select>
                        </div>

                        <button class="btn-primary btn-md">
                            <span class="btn-icon">
                                ➕
                            </span>

                            Cadastrar Pavimento
                        </button>
                    </form>
                </div>

                <div class="table-card">
                    <h3>Estrutura das Obras</h3>

                    <div id="lista-obras"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Componentes globais -->
    <script defer src="../js/components/sidebar.js"></script>
    <script defer src="../js/components/layout.js"></script>
    <script defer src="../js/components/header.js"></script>

    <!-- Storage -->
    <script defer src="../js/storage/storage.js"></script>

    <!-- Services -->
    <script defer src="../js/services/api.js"></script>
    <script defer src="../js/services/obrasService.js"></script>
    <script defer src="../js/services/pavimentosService.js"></script>
    <script defer src="../js/services/servicosService.js"></script>

    <!-- Utilitários -->
    <script defer src="../js/utils.js"></script>

    <!-- Script da página -->
    <script defer src="../js/pages/pavimentos.js"></script>
</body>

</html>
