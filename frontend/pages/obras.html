<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Obras | Obra Control</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/sidebar.css">

    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/tables.css">
    <link rel="stylesheet" href="../css/components/badges.css">

    <link rel="stylesheet" href="../css/pages/dashboard.css">
    <link rel="stylesheet" href="../css/pages/obras.css">
</head>

<body>

    <div class="container">
        <aside class="sidebar" id="sidebar">
        </aside>

        <main class="main-content">
            <div id="header-container"></div>

            <section class="dashboard">
                <div id="breadcrumb"></div>
                
                <div class="dashboard-header">
                    <h2>Cadastro de Obras</h2>

                    <p>
                        Cadastre e acompanhe suas obras.
                    </p>
                </div>

                <div class="form-card">
                    <form id="obra-form">
                        <div class="form-group">
                            <label for="nome">
                                Nome da Obra
                            </label>

                            <input type="text" id="nome" placeholder="Ex: Residencial Alpha">
                        </div>

                        <div class="form-group">
                            <label for="cliente">
                                Cliente
                            </label>

                            <input type="text" id="cliente" placeholder="Nome do cliente">
                        </div>

                        <div class="form-group">
                            <label for="endereco">
                                Endereço
                            </label>

                            <input type="text" id="endereco" placeholder="Endereço da obra">
                        </div>

                        <div class="form-group">
                            <label for="inicio">
                                Data de início
                            </label>

                            <input type="date" id="inicio">
                        </div>

                        <div class="form-group">
                            <label for="previsao">
                                Previsão de término
                            </label>

                            <input type="date" id="previsao">
                        </div>

                        <div class="form-group">
                            <label for="status">
                                Status
                            </label>

                            <select id="status">
                                <option>
                                    Planejamento
                                </option>

                                <option>
                                    Em andamento
                                </option>

                                <option>
                                    Concluída
                                </option>
                            </select>
                        </div>

                        <button class="btn-primary btn-md">
                            <span class="btn-icon">
                                ➕
                            </span>

                            Cadastrar Pavimento
                        </button>
                    </form>
                </div>

                <div class="table-card">
                    <h3>Obras Cadastradas</h3>

                    <table>
                        <thead>
                            <tr>
                                <th>Obra</th>
                                <th>Cliente</th>
                                <th>Início</th>
                                <th>Previsão</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="tabela-obras">

                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Componentes globais -->
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/components/header.js"></script>

    <!-- Utilitários -->
    <script src="../js/utils.js"></script>

    <!-- Script da página -->
    <script src="../js/obras.js"></script>
</body>

</html>
