<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serviços | Obra Control</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/sidebar.css">

    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="stylesheet" href="../css/components/tables.css">
    <link rel="stylesheet" href="../css/components/badges.css">
    <link rel="stylesheet" href="../css/components/breadcrumb.css">
    <link rel="stylesheet" href="../css/components/progress.css">

    <link rel="stylesheet" href="../css/pages/dashboard.css">
    <link rel="stylesheet" href="../css/pages/servicos.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
        </aside>

        <main class="main-content">
            <header id="header-container"></header>

            <section class="dashboard">
                <div id="breadcrumb"></div>

                <div class="form-card">
                    <form id="servico-form">
                        <div class="form-group">
                            <label for="obra">Obra</label>

                            <select id="obra" required>
                                <option value="">Selecione uma obra</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="pavimento">Pavimento</label>

                            <select id="pavimento" required>
                                <option value="">Selecione um pavimento</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="nome">Serviço</label>

                            <input type="text" id="nome" placeholder="Ex: Alvenaria" required>
                        </div>

                        <div class="form-group">
                            <label for="progresso">Progresso (%)</label>

                            <input type="number" id="progresso" min="0" max="100" value="0" required>
                        </div>

                        <button class="btn-primary btn-md">
                            <span class="btn-icon">
                                ➕
                            </span>

                            Cadastrar Pavimento
                        </button>
                    </form>
                </div>

                <div class="table-card">
                    <h3>Estrutura da Obra</h3>

                    <div id="estrutura-servicos"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Componentes globais -->
    <script defer src="../js/components/sidebar.js"></script>
    <script defer src="../js/components/layout.js"></script>
    <script defer src="../js/components/header.js"></script>

    <!-- Storage -->
    <script defer src="../js/storage/storage.js"></script>

    <!-- Utilitários -->
    <script defer src="../js/utils.js"></script>

    <!-- Script da página -->
    <script defer src="../js/pages/servicos.js"></script>
</body>

</html>
